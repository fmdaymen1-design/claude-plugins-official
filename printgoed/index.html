<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Printgoed – Original print-on-demand designs</title>
  <meta name="description" content="Printgoed: original, fun and seasonal designs on T-shirts, hoodies, ornaments, puzzles and more. Printed on demand and sold securely through Etsy.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="topbar"><span data-i18n="topbar"></span><span class="promo" id="promo"></span></div>

  <header class="header">
    <div class="container header-inner">
      <a href="#" class="logo" aria-label="Printgoed"><span class="logo-mark">P</span>printgoed</a>
      <nav class="nav" id="nav">
        <a href="#shop" data-i18n="navShop"></a>
        <a href="#collections" data-i18n="navCollections"></a>
        <a href="#how" data-i18n="navHow"></a>
        <a href="#reviews" data-i18n="navReviews"></a>
        <a href="#about" data-i18n="navAbout"></a>
        <a href="#faq" data-i18n="navFaq"></a>
      </nav>
      <div class="header-actions">
        <label class="lang">
          <span class="sr-only" data-i18n="language"></span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
          <select class="lang-select" aria-label="Language"></select>
        </label>
        <a class="btn btn-primary btn-sm etsy-link hide-sm" target="_blank" rel="noopener" data-i18n="visitEtsy"></a>
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-inner">
        <div class="hero-copy">
          <span class="eyebrow" data-i18n="heroEyebrow"></span>
          <h1><span data-i18n="heroTitle1"></span> <span class="hl" data-i18n="heroTitle2"></span><span data-i18n="heroTitle3"></span></h1>
          <p data-i18n="heroText"></p>
          <div class="hero-cta">
            <a href="#shop" class="btn btn-primary" data-i18n="heroCta"></a>
            <a href="#how" class="btn btn-ghost" data-i18n="heroCta2"></a>
          </div>
          <dl class="stats">
            <div><dt id="statProducts">–</dt><dd data-i18n="statProducts"></dd></div>
            <div><dt id="statRating">–</dt><dd data-i18n="statRating"></dd></div>
            <div><dt>100%</dt><dd data-i18n="statMade"></dd></div>
          </dl>
        </div>
        <div class="hero-visual" id="heroVisual"></div>
      </div>
    </section>

    <section class="usps">
      <div class="container usp-grid">
        <div class="usp"><strong data-i18n="uspMade"></strong><span data-i18n="uspMadeText"></span></div>
        <div class="usp"><strong data-i18n="uspQuality"></strong><span data-i18n="uspQualityText"></span></div>
        <div class="usp"><strong data-i18n="uspEtsy"></strong><span data-i18n="uspEtsyText"></span></div>
        <div class="usp"><strong data-i18n="uspService"></strong><span data-i18n="uspServiceText"></span></div>
      </div>
    </section>

    <section class="section" id="collections">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="collectionsTitle"></h2>
          <p data-i18n="collectionsText"></p>
        </div>
        <div class="cat-grid" id="catGrid"></div>
        <div class="theme-row" id="themeRow"></div>
      </div>
    </section>

    <section class="section section-alt" id="shop">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="shopTitle"></h2>
          <p data-i18n="shopText"></p>
        </div>
        <div class="toolbar">
          <div class="filters" id="filters"></div>
          <div class="toolbar-right">
            <input type="search" id="search" data-i18n-placeholder="searchPlaceholder" aria-label="Search">
            <select id="sort" aria-label="Sort">
              <option value="featured" data-i18n="sortPopular"></option>
              <option value="price-asc" data-i18n="sortPriceAsc"></option>
              <option value="price-desc" data-i18n="sortPriceDesc"></option>
              <option value="name" data-i18n="sortName"></option>
            </select>
          </div>
        </div>
        <div class="active-theme" id="activeTheme" hidden></div>
        <p class="result-count" id="resultCount"></p>
        <div class="product-grid" id="productGrid"></div>
        <p class="empty" id="emptyState" hidden></p>
        <div class="center"><button class="btn btn-ghost" id="loadMore" hidden data-i18n="loadMore"></button></div>
      </div>
    </section>

    <section class="section" id="how">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="howTitle"></h2>
          <p data-i18n="howText"></p>
        </div>
        <ol class="steps">
          <li><span class="step-num">1</span><h3 data-i18n="how1"></h3><p data-i18n="how1Text"></p></li>
          <li><span class="step-num">2</span><h3 data-i18n="how2"></h3><p data-i18n="how2Text"></p></li>
          <li><span class="step-num">3</span><h3 data-i18n="how3"></h3><p data-i18n="how3Text"></p></li>
        </ol>
      </div>
    </section>

    <section class="section section-alt" id="reviews">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="reviewsTitle"></h2>
          <p class="rating-summary"><span class="stars big" id="avgStars"></span> <span id="reviewsSummary"></span></p>
        </div>
        <div class="review-grid" id="reviewGrid"></div>
        <div class="center"><button class="btn btn-ghost" id="reviewsToggle" hidden></button></div>
      </div>
    </section>

    <section class="section about" id="about">
      <div class="container about-inner">
        <div>
          <span class="eyebrow light" data-i18n="aboutEyebrow"></span>
          <h2 data-i18n="aboutTitle"></h2>
          <p data-i18n="aboutText"></p>
          <a class="btn btn-light etsy-contact" target="_blank" rel="noopener" data-i18n="aboutCta"></a>
        </div>
        <div class="custom-card">
          <h3 data-i18n="customTitle"></h3>
          <p data-i18n="customText"></p>
          <a class="btn btn-primary etsy-contact" target="_blank" rel="noopener" data-i18n="aboutCta"></a>
        </div>
      </div>
    </section>

    <section class="section" id="faq">
      <div class="container narrow">
        <div class="section-head"><h2 data-i18n="faqTitle"></h2></div>
        <div class="faq">
          <details><summary data-i18n="faq1q"></summary><p data-i18n="faq1a"></p></details>
          <details><summary data-i18n="faq2q"></summary><p data-i18n="faq2a"></p></details>
          <details><summary data-i18n="faq3q"></summary><p data-i18n="faq3a"></p></details>
          <details><summary data-i18n="faq4q"></summary><p data-i18n="faq4a"></p></details>
          <details><summary data-i18n="faq5q"></summary><p data-i18n="faq5a"></p></details>
          <details><summary data-i18n="faq6q"></summary><p data-i18n="faq6a"></p></details>
        </div>
      </div>
    </section>

    <section class="section cta-band">
      <div class="container narrow center">
        <h2 data-i18n="ctaTitle"></h2>
        <p data-i18n="ctaText"></p>
        <a class="btn btn-dark etsy-link" target="_blank" rel="noopener" data-i18n="visitEtsy"></a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-grid">
      <div>
        <a href="#" class="logo logo-light"><span class="logo-mark">P</span>printgoed</a>
        <p data-i18n="footerText"></p>
      </div>
      <div>
        <h4 data-i18n="footerShop"></h4>
        <a href="#shop" data-i18n="shopTitle"></a>
        <a href="#collections" data-i18n="navCollections"></a>
        <a class="etsy-link" target="_blank" rel="noopener" data-i18n="footerEtsy"></a>
      </div>
      <div>
        <h4 data-i18n="footerHelp"></h4>
        <a href="#how" data-i18n="navHow"></a>
        <a href="#faq" data-i18n="navFaq"></a>
        <a class="etsy-contact" target="_blank" rel="noopener" data-i18n="aboutCta"></a>
      </div>
      <div>
        <h4 data-i18n="footerLang"></h4>
        <select class="lang-select footer-lang" aria-label="Language"></select>
      </div>
    </div>
    <div class="container footer-bottom">
      <span>© <span id="year"></span> Printgoed. <span data-i18n="rights"></span></span>
      <span>Etsy is a trademark of Etsy, Inc.</span>
    </div>
  </footer>

  <div class="modal" id="productModal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="pmTitle">
      <button class="modal-close" data-close data-i18n-aria="close">×</button>
      <div class="pm-grid">
        <div class="gallery">
          <div class="gallery-main">
            <img id="pmImage" alt="">
            <button class="gal-nav prev" id="galPrev" data-i18n-aria="prev">‹</button>
            <button class="gal-nav next" id="galNext" data-i18n-aria="next">›</button>
          </div>
          <div class="thumbs" id="pmThumbs"></div>
        </div>
        <div class="pm-info">
          <h3 id="pmTitle"></h3>
          <p class="pm-price" id="pmPrice"></p>
          <div id="pmOptions"></div>
          <a class="btn btn-primary full" id="pmBuy" target="_blank" rel="noopener">
            <span data-i18n="buyOnEtsy"></span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
          </a>
          <p class="note" data-i18n="etsyNote"></p>
          <div class="pm-desc" id="pmDesc"></div>
          <p class="note lang-note" id="descNote" data-i18n="descNote"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/catalog-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
